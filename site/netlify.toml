[build]
  publish = "public"
  # Pack Fren's source (the repo is private) for new servers: see vps-src.mjs.
  command = "mkdir -p fren-src && git -C .. archive --format=tar.gz --prefix=fren/ -o site/fren-src/fren.tar.gz HEAD"

[functions]
  directory = "netlify/functions"
  included_files = ["fren-src/fren.tar.gz"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.sh"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"
